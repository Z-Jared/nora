services:
  nora:
    build: .
    ports:
      - "${NORA_PORT:-8080}:8080"
    environment:
      - NORA_HOST=0.0.0.0
      - NORA_PORT=8080
      - NORA_API_TOKEN=${NORA_API_TOKEN:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./plugins:/app/plugins
      - ./agent.yaml:/app/agent.yaml:ro
      - ./.env:/app/.env:ro
    restart: unless-stopped
