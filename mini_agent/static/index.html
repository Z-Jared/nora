<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;display:flex;flex-direction:column;height:100vh}
header{background:#2c3e50;color:#fff;padding:12px 20px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
header .token-area{display:flex;align-items:center;gap:8px}
header .token-area label{font-size:12px;opacity:0.8}
header .token-area input{padding:4px 8px;border:none;border-radius:4px;font-size:12px;width:180px;outline:none}
header .token-area input::placeholder{color:#999}
.container{display:flex;flex:1;overflow:hidden}
.chat-panel{flex:2;display:flex;flex-direction:column;border-right:1px solid #ddd}
.side-panel{flex:1;display:flex;flex-direction:column;min-width:280px}
.messages{flex:1;overflow-y:auto;padding:16px}
.msg{margin-bottom:12px;padding:10px 14px;border-radius:8px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#3498db;color:#fff;margin-left:auto}
.msg.assistant{background:#fff;border:1px solid #e0e0e0}
.msg.error{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb}
.tool-events,.status-area{padding:12px;overflow-y:auto}
.tool-events{flex:1;border-bottom:1px solid #ddd}
.status-area{min-height:80px;background:#fafafa}
.tool-events h3,.status-area h3{font-size:13px;color:#888;text-transform:uppercase;margin-bottom:8px;letter-spacing:0.5px}
.event-item{font-size:13px;padding:6px 8px;margin-bottom:4px;border-radius:4px;background:#fff;border:1px solid #eee;font-family:"SF Mono",Monaco,Consolas,monospace}
.event-item.start{border-left:3px solid #e67e22}
.event-item.result{border-left:3px solid #27ae60}
.status-line{font-size:13px;font-family:"SF Mono",Monaco,Consolas,monospace;padding:4px 0}
.status-line .label{color:#888}
.input-area{display:flex;padding:12px;background:#fff;border-top:1px solid #ddd}
.input-area input{flex:1;padding:10px 14px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none}
.input-area input:focus{border-color:#3498db}
.input-area button{margin-left:8px;padding:10px 20px;background:#3498db;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.input-area button:hover{background:#2980b9}
.input-area button:disabled{background:#bdc3c7;cursor:not-allowed}
</style>
</head>
<body>
<header><span>Nora</span><div class="token-area"><label>Token:</label><input id="token" type="password" placeholder="API token (optional)"></div></header>
<div class="container">
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input id="input" type="text" placeholder="Send a message..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>
  <div class="side-panel">
    <div class="tool-events" id="tool-events">
      <h3>Tool Events</h3>
    </div>
    <div class="status-area" id="status-area">
      <h3>Status</h3>
    </div>
  </div>
</div>
<script>
(function(){
  var msgEl = document.getElementById('messages');
  var toolEl = document.getElementById('tool-events');
  var statusEl = document.getElementById('status-area');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var tokenInput = document.getElementById('token');

  tokenInput.value = localStorage.getItem('nora_token') || '';
  tokenInput.addEventListener('change', function(){ localStorage.setItem('nora_token', tokenInput.value); });

  function addMsg(text, cls){
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    msgEl.appendChild(d);
    msgEl.scrollTop = msgEl.scrollHeight;
  }

  function addToolEvent(type, name, detail){
    var d = document.createElement('div');
    d.className = 'event-item ' + (type === 'start' ? 'start' : 'result');
    d.textContent = (type === 'start' ? '▶ ' : '✔ ') + name + (detail ? ' — ' + detail : '');
    toolEl.appendChild(d);
    toolEl.scrollTop = toolEl.scrollHeight;
  }

  function setStatus(label, value){
    var id = 'status-' + label;
    var el = document.getElementById(id);
    if(!el){
      el = document.createElement('div');
      el.className = 'status-line';
      el.id = id;
      statusEl.appendChild(el);
    }
    el.innerHTML = '<span class="label">' + label + ':</span> ' + value;
  }

  function clearStatus(){
    var keep = statusEl.querySelector('h3');
    statusEl.innerHTML = '';
    if(keep) statusEl.appendChild(keep);
  }

  function clearToolEvents(){
    var keep = toolEl.querySelector('h3');
    toolEl.innerHTML = '';
    if(keep) toolEl.appendChild(keep);
  }

  function sendMessage(){
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    sendBtn.disabled = true;
    addMsg(text, 'user');
    clearToolEvents();
    clearStatus();
    setStatus('state', 'connecting');

    var assistantBuf = '';
    var assistantEl = null;

    var headers = {'Content-Type': 'application/json'};
    var token = tokenInput.value.trim();
    if(token) headers['Authorization'] = 'Bearer ' + token;

    fetch('/chat/stream', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({message: text})
    }).then(function(resp){
      if(!resp.ok) return resp.json().then(function(e){ throw new Error(e.error || 'HTTP '+resp.status); });
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function read(){
        return reader.read().then(function(result){
          if(result.done) return;
          buf += decoder.decode(result.value, {stream:true});
          var lines = buf.split('\n');
          buf = lines.pop();
          for(var i=0;i<lines.length;i++){
            var line = lines[i].trim();
            if(!line || !line.startsWith('data: ')) continue;
            try{
              var evt = JSON.parse(line.slice(6));
              handleEvent(evt);
            }catch(e){}
          }
          return read();
        });
      }
      return read();
    }).catch(function(e){
      addMsg(e.message, 'error');
      setStatus('state', 'error');
    }).finally(function(){
      sendBtn.disabled = false;
      input.focus();
    });

    function handleEvent(evt){
      switch(evt.type){
        case 'typing':
          setStatus('state', 'typing...');
          break;
        case 'tool_call_start':
          addToolEvent('start', evt.name, JSON.stringify(evt.arguments));
          break;
        case 'tool_call_result':
          var detail = evt.status;
          if(evt.result) detail += ' — ' + (typeof evt.result === 'string' ? evt.result.slice(0,80) : JSON.stringify(evt.result).slice(0,80));
          addToolEvent('result', evt.name, detail);
          break;
        case 'delta':
          if(!assistantEl){
            assistantEl = document.createElement('div');
            assistantEl.className = 'msg assistant';
            msgEl.appendChild(assistantEl);
          }
          assistantBuf += evt.content;
          assistantEl.textContent = assistantBuf;
          msgEl.scrollTop = msgEl.scrollHeight;
          setStatus('state', 'streaming');
          break;
        case 'done':
          setStatus('state', 'done');
          setStatus('status', evt.status || '-');
          setStatus('tool_calls', evt.tool_calls != null ? evt.tool_calls : '-');
          sendBtn.disabled = false;
          break;
        case 'error':
          addMsg(evt.error, 'error');
          setStatus('state', 'error');
          break;
      }
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.isComposing) sendMessage();
  });
  input.focus();
})();
</script>
</body>
</html>
